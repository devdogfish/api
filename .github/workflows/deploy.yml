name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEPLOY_PATH: /root/api
      PRODUCTION_DASHBOARD_URL: https://dashboard.girke.dev
      PRODUCTION_HEALTH_URL: https://api.girke.dev/health
      PRODUCTION_OPENAPI_URL: https://api.girke.dev/openapi.json
      PRODUCTION_REFERENCE_URL: https://api.girke.dev/reference
      PRODUCTION_VERSION_URL: https://api.girke.dev/version
      REPOSITORY_URL: https://github.com/devdogfish/api.git
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '72.60.27.33 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL5LxaEZRNiTrRJNdNSBJ8bcLa3YVHSGtU7AxYvYMEFo' >> ~/.ssh/known_hosts

      - name: Deploy API and Whisper
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' REPOSITORY_URL='$REPOSITORY_URL' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          gh auth setup-git -h github.com
          git config --global --unset-all url.git@github.com:.insteadOf || true
          git config --global --unset-all url.ssh://git@github.com/.insteadOf || true
          git config --local --unset-all url.git@github.com:.insteadOf || true
          git config --local --unset-all url.ssh://git@github.com/.insteadOf || true
          git remote set-url origin "$REPOSITORY_URL"
          git fetch --prune origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_SHA" ]]; then
            echo 'Main changed after this deployment was queued.' >&2
            exit 1
          fi

          git show "$RELEASE_SHA:scripts/deploy-hostinger.sh" | bash -s -- "$DEPLOY_PATH" "$RELEASE_SHA"
          REMOTE

      - name: Verify production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_HEALTH_URL" | grep '"ok":true'
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_VERSION_URL" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_OPENAPI_URL" | grep '"openapi":"3.1.0"'
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_REFERENCE_URL" | grep '/openapi.json'
          fence_body=$(mktemp)
          trap 'rm "$fence_body"' EXIT
          for path in / /api/health; do
            status=$(curl --silent --show-error --max-time 10 --output "$fence_body" --write-out '%{http_code}' "${PRODUCTION_DASHBOARD_URL%/}$path")
            if [[ "$status" != 503 ]] || [[ "$(cat "$fence_body")" != 'Quantself migration in progress. Try again shortly.' ]]; then
              printf 'Expected the legacy dashboard rollback fence at %s, got HTTP %s.\n' "$path" "$status" >&2
              exit 1
            fi
          done
