name: Deploy

# api.girke.dev runs on Atlas VM 3500 (quantself ADR 0045, "Girke API on Atlas").
# The VM pulls main every minute and deploys it itself (deploy/home/girke-deploy);
# nothing pushes into the home network. This workflow only waits until production
# reports this commit, or a newer main commit that contains it, at /version.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify home deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: https://api.girke.dev
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Wait for production to report this commit
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          deadline=$((SECONDS + 40 * 60))
          while (( SECONDS < deadline )); do
            live=$(curl -fsS --max-time 10 "$BASE_URL/version" | jq -r .version || true)
            if [[ "$live" == "$RELEASE_SHA" ]]; then
              echo "Production runs $RELEASE_SHA."; break
            fi
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              status=$(gh api "repos/$REPO/compare/$RELEASE_SHA...$live" --jq .status 2>/dev/null || true)
              if [[ "$status" == ahead ]]; then
                echo "Production runs $live, a newer main commit that contains $RELEASE_SHA."; break
              fi
            fi
            echo "Production reports ${live:-nothing}; waiting."
            sleep 30
          done
          (( SECONDS < deadline )) || { echo "Production never reported $RELEASE_SHA." >&2; exit 1; }

      - name: Verify public routes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$BASE_URL/health" | grep '"ok":true'
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$BASE_URL/openapi.json" | grep '"openapi":"3.1.0"'
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$BASE_URL/reference" | grep '/openapi.json'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/v1/ocr")
          [[ "$status" == 401 ]] || { echo "Expected 401 without a token, got $status." >&2; exit 1; }
